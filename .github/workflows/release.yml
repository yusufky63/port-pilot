name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --workspace --locked

      # The signing key signs the installer for the in-app updater; the app only installs
      # packages signed with it.
      - name: Build the installer and the CLI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --bundles nsis
          cargo build --release --locked -p portpilot-cli

      - name: Package portable zip, update feed and checksums
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Repo "${{ github.repository }}"

      - name: Check the update feed
        shell: pwsh
        run: if (-not (Test-Path release/latest.json)) { throw "latest.json is missing; is the signing key set?" }

      # Published right away and marked latest: installed copies find it through
      # releases/latest/download/latest.json.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          gh release create $tag --title "PortPilot $version" --notes-file release-notes.md --latest (Get-ChildItem release -File | ForEach-Object FullName)
