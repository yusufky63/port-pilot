name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --workspace --locked

      - name: Build the installer and the CLI
        run: |
          pnpm tauri build --bundles nsis
          cargo build --release --locked -p portpilot-cli

      - name: Package portable zip and checksums
        shell: pwsh
        run: ./scripts/package-portable.ps1

      # Releases stay drafts: a maintainer reads the notes and publishes by hand.
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Release notes are the CHANGELOG section for this version.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n### Verify your download`nSHA-256 checksums are in SHA256SUMS.txt. Builds are not code-signed yet; see the README for the SmartScreen note."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $ghArgs = @($tag, '--draft', '--title', "PortPilot $version", '--notes-file', 'release-notes.md')
          if ($version -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs (Get-ChildItem release -File | ForEach-Object FullName)
