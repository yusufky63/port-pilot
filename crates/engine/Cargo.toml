[package]
name = "portpilot-engine"
description = "Discovery, attribution and safe stop for PortPilot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
portpilot-core = { path = "../core" }
portpilot-win = { path = "../win" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Test fixture: a small server the integration tests start, inspect and stop.
[[bin]]
name = "pp-fixture"
path = "src/bin/fixture.rs"
test = false
doc = false
