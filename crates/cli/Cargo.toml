[package]
name = "portpilot-cli"
description = "portctl: explain and control local development ports on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "portctl"
path = "src/main.rs"

[dependencies]
portpilot-core = { path = "../core" }
portpilot-engine = { path = "../engine" }
portpilot-win = { path = "../win" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
