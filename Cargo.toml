[workspace]
resolver = "3"
members = ["crates/core", "crates/win", "crates/engine", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yusufky63/port-pilot"
authors = ["yusufky63"]
rust-version = "1.90"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
