[package]
name = "port-pilot"
description = "Port Pilot: explains and controls local development ports on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "portpilot_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
portpilot-core = { path = "../crates/core" }
portpilot-engine = { path = "../crates/engine" }
portpilot-win = { path = "../crates/win" }
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
parking_lot = "=0.12.5"
